---
layout: default
---
<article class="article">
  <header>
    <div class="meta">{{ page.categories | first }} · {{ page.date | date: "%Y.%m.%d" }}</div>
    <h1>{{ page.title }}</h1>
    <p>{{ page.description }}</p>
  </header>
  <div class="content">{{ content }}</div>
  <a class="back-link" href="{{ '/' | relative_url }}">← 뉴스툰 홈으로</a>
</article>
